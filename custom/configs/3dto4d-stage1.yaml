name: "animate124-stage1"
tag: "${rmspace:${system.prompt_processor.prompt},_}"
exp_root_dir: "outputs"
seed: 0

data_type: "animate124-image-video-combined-camera-datamodule"
data:
  prob_multi_view: 0.
  image:
    image_path: ???
    height: 256
    width: 256
    rotate: 1

  single_view:
    batch_size: 1
    # 0-4999: 64x64, >=5000: 512x512
    # this drastically reduces VRAM usage as empty space is pruned in early training
    width: 256
    height: 256
    elevation_range: [-45, 45]
    azimuth_range: [-180, 180]
    camera_distance_range: [2.5, 2.5]
    fovy_range: [40.0, 40.0]
    camera_perturb: 0.
    center_perturb: 0.
    up_perturb: 0.
#    eval_camera_distance: ${data.image.default_camera_distance}
#    eval_fovy_deg: ${data.image.default_fovy_deg}
#    eval_elevation_deg: ${data.image.default_elevation_deg}
    static: true
    num_frames: 1 
    simultan: False
    prob_single_view_video: 1.0
    width_vid: 288 
    height_vid: 160 
    sample_rand_frames: fps
    num_frames_factor: 4
    eval_height: 256
    eval_width: 256
    n_val_views: 4
    n_test_views: 120

  multi_view:
    batch_size: [ 4 ]
    n_view: 4
    width: 256
    height: 256
    resolution_milestones: [ 5000 ]
    camera_distance_range: [ 2.5, 2.5 ]
    fovy_range: [ 40.0, 40.0 ]
    elevation_range: [ 0, 30 ]
    camera_perturb: 0.
    center_perturb: 0.
    up_perturb: 0.
    n_val_views: 4
    eval_camera_distance: 3.0
    eval_fovy_deg: 40.
    relative_radius: false
    train_dynamic_camera: True
    num_frames: ${data.single_view.num_frames}
    sample_rand_frames: t0
    eval_height: ${data.single_view.eval_height}
    eval_width: ${data.single_view.eval_width}


system_type: "animate124-system"
system:
  prob_multi_view: ${data.prob_multi_view}
  prob_single_view_video: ${data.single_view.prob_single_view_video}
  stage: coarse
  geometry_type: "animate124-implicit-volume"
  geometry:
    radius: 1.0
    normal_type: "finite_difference"

    density_bias: "blob_magic3d"
    density_activation: softplus
    density_blob_scale: 10.
    density_blob_std: 0.5

    pos_encoding_config:
      otype: HashGridSpatialTime
      n_levels: 16
      n_features_per_level: 2
      log2_hashmap_size: 19
      base_resolution: 16
      per_level_scale: 1.447269237440378 # max resolution 4096
      static: ${data.single_view.static}
      num_frames: ${data.single_view.num_frames}


  material_type: "no-material"
  material:
    requires_normal: true


  background_type: "solid-color-background"

  renderer_type: "animate124-nerf-volume-renderer"
  renderer:
    radius: ${system.geometry.radius}
    num_samples_per_ray: 256
    return_comp_normal: true

  simultan: ${data.single_view.simultan}

#  prompt_processor_type: "stable-diffusion-prompt-processor"
#  prompt_processor:
#    pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
#    prompt: ???
#    spawn: False

#  guidance_type: "stable-diffusion-unified-guidance"
#  guidance:
#    guidance_type: "sds"
#    pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
#    guidance_scale: 100.
#    min_step_percent: 0.2
#    max_step_percent: 0.6

  loggers:
    wandb:
      enable: false
      project: "object-animation"
      name: None
      kwargs: # args passed to wandb.init like `entity`, `tags`, `wandb.Settings(_disable_stats=True)`
        settings:
          _disable_stats: True # turn off system metrics logging (such as `nvidia_gpu_stat` which apparently takes whole lot of CPU memory and causes CPU bottleneck which drastically slows down all the server and causes low GPU utilization (which will make the program take extremely longer)).
          _disable_meta: True # Do not collect system metadata (NOTE - this is part of how to turn off system metrics logging)
          # _stats_sampling_interval: 10000000.0 # (NOTE - time is in seconds and its type is float) another option is point an extremely large sampling interval and then it will never check system metrics and thus will not cause CPU bottleneck (e.g., 10000000secs = 2777hours)

  loss:
    lambda_rgb: 0.
    lambda_sd_img: 0.
    lambda_sd: 0.
    lambda_3d_sd: 0.
    lambda_orient: 0.
    lambda_normal_smoothness_2d: 5e3
    lambda_sparsity: 0.
    lambda_opaque: 5e3
    lambda_z_variance: 5e3
    lambda_tv: 0.

    lambda_volume: 0.0

    lambda_nerf_rgb: 2e4
    lambda_nerf_depth: 2e4
    lambda_nerf_normal: 1e4
    lambda_nerf_mask: 1e6

  optimizer:
    name: Adam
    args:
      lr: 0.01
      betas: [0.9, 0.99]
      eps: 1.e-8
    params:
      geometry.encoding:
        lr: 0.01
      geometry.density_network:
        lr: 0.001
      geometry.feature_network:
        lr: 0.001

trainer:
  max_steps: 3000
  log_every_n_steps: 10
  num_sanity_val_steps: 0
  val_check_interval: 1000
  enable_progress_bar: true
  precision: 16-mixed

checkpoint:
  save_last: true
  save_top_k: 0 #-1
  every_n_train_steps: ${trainer.max_steps}
