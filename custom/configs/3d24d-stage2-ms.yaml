name: "animate124-stage2"
tag: "${rmspace:${system.prompt_processor.prompt},_}"
exp_root_dir: "outputs"
seed: 0

data_type: "animate124-image-video-combined-camera-datamodule"
data:
  prob_multi_view: 0.
  image:
    image_path: ???
    height: 256
    width: 256
#    default_elevation_deg: 0.0
#    default_azimuth_deg: 0.0
#    default_camera_distance: 2.5
#    default_fovy_deg: 40.0
    random_camera:
      batch_size: 1
      height: 256
      width: 256
      elevation_range: [-10, 45]
      azimuth_range: [-180, 180]
      camera_distance_range: [2.5, 2.5]
      fovy_range: [40.0, 40.0]
      camera_perturb: 0.0
      center_perturb: 0.0
      up_perturb: 0.0
      eval_height: 256
      eval_width: 256
      eval_elevation_deg: 0.0
      eval_camera_distance: 2.5
      eval_fovy_deg: 40.0
      n_val_views: 4
      n_test_views: 120

  single_view:
    batch_size: 1
    # 0-4999: 64x64, >=5000: 512x512
    # this drastically reduces VRAM usage as empty space is pruned in early training
    width: 256
    height: 256
    elevation_range: [-10, 45]
    azimuth_range: [-180, 180]
    camera_distance_range: [2.5, 2.5]
    fovy_range: [40.0, 40.0]
    camera_perturb: 0.
    center_perturb: 0.
    up_perturb: 0.
    eval_camera_distance: 2.5
    eval_fovy_deg: 40.0
    eval_elevation_deg: 0.0
    static: False
    num_frames: 16 
    simultan: true
    prob_single_view_video: 1.0
    width_vid: 256 #
    height_vid: 256 #
    sample_rand_frames: uniform
    num_frames_factor: 4
    eval_height: 256
    eval_width: 256
    test_traj: 'motion_smooth_full'
    n_val_views: 4
    n_test_views: 120
    train_dynamic_camera: false
    batch_uniform_azimuth: false
    zero_rate: 1.0
    camera_sampling: incremental #random or incremental


system_type: "animate124-system"
system:
  prob_multi_view: ${data.prob_multi_view}
  prob_single_view_video: ${data.single_view.prob_single_view_video}
  stage: coarse
  geometry_type: "animate124-implicit-volume"
  geometry:
    radius: 1.0
    normal_type: "finite_difference"

    density_bias: "blob_magic3d"
    density_activation: softplus
    density_blob_scale: 10.
    density_blob_std: 0.5

    pos_encoding_config:
      otype: HashGridSpatialTime
      n_levels: 16
      n_features_per_level: 2
      log2_hashmap_size: 19
      base_resolution: 16
      per_level_scale: 1.447269237440378 # max resolution 4096
      static: ${data.single_view.static}
      num_frames: ${data.single_view.num_frames}

  material_type: "no-material"
  material:
    requires_normal: true


  background_type: "solid-color-background"

  renderer_type: "animate124-nerf-volume-renderer"
  renderer:
    radius: ${system.geometry.radius}
    num_samples_per_ray: 256
    return_comp_normal: true

  simultan: ${data.single_view.simultan}

  guidance_3d_type: "zero123-unified-guidance"
  guidance_3d:
    pretrained_model_name_or_path: "bennyguo/zero123-diffusers"
    guidance_type: "sds"
    guidance_scale: 5.0
    min_step_percent: 0.2
    max_step_percent: 0.6

#    cond_image_path: ${data.image.image_path}
#    cond_elevation_deg: ${data.image.default_elevation_deg}
#    cond_azimuth_deg: ${data.image.default_azimuth_deg}
#    cond_camera_distance: ${data.image.default_camera_distance}


  prompt_processor_type: "animate124-zeroscope-prompt-processor"
  prompt_processor:
    pretrained_model_name_or_path: "damo-vilab/text-to-video-ms-1.7b"
    prompt: ???
    obj_token_clip_idx: 0
    negative_prompt: 'worst quality, inconsistent motion, blurry, jittery, distorted'
    spawn: False

  guidance_type: "animate124-zeroscope-guidance"
  guidance:
    weighting_strategy: sds
    pretrained_model_name_or_path: "damo-vilab/text-to-video-ms-1.7b"
    guidance_scale: 100.
    min_step_percent: 0.02
    max_step_percent: 0.98
    low_ram_vae: -1 ## set to a positive integer (the number of frames with gradient) if hope to use this
    max_steps: 10000
    timestep_strategy: "random" # "random" or "decrease"
    loss_attention_masking: False

  loggers:
    wandb:
      enable: false
      project: "object-animation"
      name: None
      kwargs: # args passed to wandb.init like `entity`, `tags`, `wandb.Settings(_disable_stats=True)`
        settings:
          _disable_stats: True # turn off system metrics logging (such as `nvidia_gpu_stat` which apparently takes whole lot of CPU memory and causes CPU bottleneck which drastically slows down all the server and causes low GPU utilization (which will make the program take extremely longer)).
          _disable_meta: True # Do not collect system metadata (NOTE - this is part of how to turn off system metrics logging)
          # _stats_sampling_interval: 10000000.0 # (NOTE - time is in seconds and its type is float) another option is point an extremely large sampling interval and then it will never check system metrics and thus will not cause CPU bottleneck (e.g., 10000000secs = 2777hours)

  loss:
    lambda_rgb: 1000.
    lambda_mask: 100.
    lambda_sds_video: 1.
    lambda_3d_sd: 40. #
    lambda_orient: 0.
    lambda_normal_smoothness_2d: 0.
    lambda_sparsity: 0.
    lambda_opaque: 0.
    lambda_z_variance: 0.
    lambda_tv: 0.

    lambda_anticipate: 100.
    lambda_volume: 0.0

    lambda_nerf_rgb: 2e4
    lambda_nerf_depth: 2e4
    lambda_nerf_normal: 1e4
    lambda_nerf_mask: 1e6

  optimizer:
    name: Adam
    args:
      lr: 0.01
      betas: [0.9, 0.99]
      eps: 1.e-8
    params:
      geometry.encoding.encoding.encoding: # NOTE should be 3 encoding
        lr: 0.0001
      geometry.encoding.encoding.encoding_time:
        lr: 0.01
      geometry.density_network:
        lr: 0.001
      geometry.feature_network:
        lr: 0.001

trainer:
  max_steps: 15000
  log_every_n_steps: 10
  num_sanity_val_steps: 0
  val_check_interval: 5000
  enable_progress_bar: true
  precision: 16-mixed

checkpoint:
  save_last: true
  save_top_k: 0 #-1
  every_n_train_steps: ${trainer.max_steps}
